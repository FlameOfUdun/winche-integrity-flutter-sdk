name: winche_integrity
description: Winche Integrity for Flutter — proof that requests to a Winche project come from its own app (App Attest on iOS and macOS, Play Integrity on Android, a browser check on the web).
version: 0.1.0
repository: https://github.com/FlameOfUdun/winche-integrity-flutter-sdk
issue_tracker: https://github.com/FlameOfUdun/winche-integrity-flutter-sdk/issues

topics:
  - backend
  - security
  - app-attest
  - play-integrity
  - turnstile

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  crypto: ^3.0.6
  web: ^1.1.0
  winche_core: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.winche.winche_integrity
        pluginClass: WincheIntegrityPlugin
      ios:
        pluginClass: WincheIntegrityPlugin
      macos:
        pluginClass: WincheIntegrityPlugin
      web:
        pluginClass: WincheIntegrityWeb
        fileName: src/winche_integrity_web.dart
