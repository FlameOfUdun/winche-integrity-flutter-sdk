name: winche_app_attest
description: Apple's App Attest for Winche Integrity — proof, on iOS and macOS, that requests to a Winche project come from its own app.
version: 0.1.0
repository: https://github.com/FlameOfUdun/winche-app-attest-flutter
issue_tracker: https://github.com/FlameOfUdun/winche-app-attest-flutter/issues

topics:
  - backend
  - security
  - app-attest

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  winche_core: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: WincheAppAttestPlugin
      macos:
        pluginClass: WincheAppAttestPlugin
